<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Curage Vandaele</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --green-900: #0d2b1a;
      --green-800: #133d22;
      --green-600: #2d7a4f;
      --green-500: #3d9e62;
      --green-400: #56b57a;
      --green-50:  #f0faf4;
      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-600:  #4b5563;
      --gray-500:  #6b7280;
      --gray-400:  #9ca3af;
      --gray-200:  #e5e7eb;
      --gray-100:  #f3f4f6;
      --white:     #ffffff;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --blue:      #3b82f6;
      --purple:    #8b5cf6;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--gray-900); background: var(--gray-100); min-height: 100vh; }

    /* ── LOGIN ───────────────────────────────────────── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--green-900) 0%, #1a5232 100%);
      padding: 1rem;
    }
    .login-card {
      background: var(--white); border-radius: 18px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.35); text-align: center;
    }
    .login-logo { margin-bottom: 1.5rem; }
    .login-logo img { height: 52px; }
    .login-card h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: .35rem; }
    .login-card > p { color: var(--gray-500); font-size: .875rem; margin-bottom: 1.75rem; }
    .login-card .fg { margin-bottom: 1rem; text-align: left; }
    .login-card label { display: block; font-size: .78rem; font-weight: 600; color: var(--gray-700); margin-bottom: .35rem; }
    .login-card input {
      width: 100%; padding: .65rem .9rem;
      border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-family: inherit; font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--green-500); }
    .login-error {
      background: #fef2f2; color: var(--red);
      border: 1px solid #fecaca; border-radius: 8px;
      padding: .6rem .9rem; font-size: .83rem; margin-bottom: 1rem; text-align: left;
    }
    .btn-login {
      width: 100%; padding: .8rem; background: var(--green-500); color: var(--white);
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: background .2s; margin-top: .25rem;
    }
    .btn-login:hover { background: var(--green-600); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* ── DASHBOARD LAYOUT ────────────────────────────── */
    #dashboard { display: flex; flex-direction: column; min-height: 100vh; }

    .admin-header { background: var(--green-800); color: var(--white); position: sticky; top: 0; z-index: 100; }
    .admin-header-inner {
      max-width: 1400px; margin: 0 auto; padding: .85rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .admin-brand { display: flex; align-items: center; gap: .75rem; }
    .admin-logo-img { height: 30px; filter: brightness(10); }
    .admin-brand-name { font-weight: 600; font-size: .95rem; }
    .admin-user { display: flex; align-items: center; gap: 1rem; font-size: .82rem; }
    #user-email { color: rgba(255,255,255,.6); }
    .btn-logout {
      padding: .38rem .85rem; background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
      color: var(--white); font-size: .78rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.2); }

    .admin-body {
      flex: 1; display: flex; max-width: 1400px; margin: 0 auto;
      width: 100%; gap: 1.5rem; padding: 1.5rem;
    }

    /* ── SIDEBAR ─────────────────────────────────────── */
    .admin-sidebar { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.25rem; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .stat-card {
      background: var(--white); border-radius: var(--radius);
      padding: .85rem .6rem; box-shadow: var(--shadow); text-align: center;
    }
    .stat-val { font-size: 1.7rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: .68rem; color: var(--gray-500); margin-top: .25rem; text-transform: uppercase; letter-spacing: .06em; }
    .stat-new  .stat-val { color: var(--red); }
    .stat-prog .stat-val { color: var(--yellow); }
    .stat-won  .stat-val { color: var(--green-500); }

    .filter-nav {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .filter-nav .fnav-btn {
      padding: .68rem 1rem; border: none; background: none;
      text-align: left; font-size: .83rem; color: var(--gray-700);
      cursor: pointer; transition: background .15s;
      border-left: 3px solid transparent; font-family: inherit; font-weight: 500;
    }
    .filter-nav .fnav-btn:hover { background: var(--gray-100); }
    .filter-nav .fnav-btn.active { background: var(--green-50); border-left-color: var(--green-500); color: var(--green-600); font-weight: 600; }

    .btn-refresh {
      padding: .55rem; background: var(--white); border: 1.5px solid var(--gray-200);
      border-radius: var(--radius); font-size: .83rem; color: var(--gray-700);
      cursor: pointer; font-family: inherit; font-weight: 500; transition: border-color .2s;
    }
    .btn-refresh:hover { border-color: var(--green-400); }

    /* ── MAIN ────────────────────────────────────────── */
    .admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1rem; }

    .main-toolbar { display: flex; gap: .75rem; }
    #search-input {
      flex: 1; padding: .63rem 1rem;
      border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-size: .88rem; font-family: inherit; background: var(--white);
      outline: none; transition: border-color .2s;
    }
    #search-input:focus { border-color: var(--green-500); }
    #sort-select {
      padding: .63rem .9rem; border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-size: .83rem; font-family: inherit; background: var(--white); cursor: pointer; outline: none;
    }

    .requests-list { display: flex; flex-direction: column; gap: .7rem; }
    .state-msg {
      background: var(--white); border-radius: var(--radius);
      padding: 3rem; text-align: center; color: var(--gray-500);
      box-shadow: var(--shadow);
    }

    /* Request card */
    .req-card {
      background: var(--white); border-radius: var(--radius);
      padding: .95rem 1.2rem; box-shadow: var(--shadow);
      cursor: pointer; border: 1.5px solid transparent;
      border-left-width: 4px;
      transition: border-color .15s, box-shadow .15s;
      display: flex; align-items: flex-start; gap: 1rem;
    }
    .req-card:hover { box-shadow: 0 2px 18px rgba(0,0,0,.1); }

    .req-card.s-nouveau      { border-left-color: var(--red); }
    .req-card.s-contacte     { border-left-color: var(--yellow); }
    .req-card.s-devis_envoye { border-left-color: var(--blue); }
    .req-card.s-chantier_gagne { border-left-color: var(--green-500); }
    .req-card.s-sans_suite   { border-left-color: var(--gray-400); }

    .card-main { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; font-size: .95rem; }
    .card-addr { color: var(--gray-500); font-size: .78rem; margin-top: .12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .5rem; }
    .ctag {
      font-size: .68rem; font-weight: 600; padding: .18rem .52rem;
      border-radius: 99px; background: var(--green-50); color: var(--green-600);
    }
    .card-right { text-align: right; flex-shrink: 0; }
    .card-amount { font-weight: 700; font-size: .9rem; color: var(--green-600); }
    .card-date { font-size: .72rem; color: var(--gray-400); margin-top: .18rem; }
    .card-badge { margin-top: .4rem; }

    /* Badges */
    .badge {
      display: inline-block; font-size: .67rem; font-weight: 700;
      padding: .18rem .55rem; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .b-nouveau       { background:#fef2f2; color:var(--red); }
    .b-contacte      { background:#fffbeb; color:#d97706; }
    .b-devis_envoye  { background:#eff6ff; color:var(--blue); }
    .b-chantier_gagne{ background:var(--green-50); color:var(--green-600); }
    .b-sans_suite    { background:var(--gray-100); color:var(--gray-500); }

    /* ── DETAIL DRAWER ───────────────────────────────── */
    .detail-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 200;
    }
    .detail-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(580px, 100vw); background: var(--white);
      z-index: 201; overflow-y: auto;
      display: flex; flex-direction: column;
      box-shadow: -6px 0 40px rgba(0,0,0,.18);
    }
    .drawer-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 1.4rem 1.5rem; border-bottom: 1px solid var(--gray-200);
      position: sticky; top: 0; background: var(--white); z-index: 1;
    }
    .drawer-header h2 { font-size: 1.1rem; font-weight: 700; }
    .drawer-meta { font-size: .78rem; color: var(--gray-500); margin-top: .22rem; }
    .drawer-close {
      padding: .4rem .55rem; background: var(--gray-100);
      border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; color: var(--gray-700); flex-shrink: 0;
    }
    .drawer-close:hover { background: var(--gray-200); }
    .drawer-body { padding: 1.4rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .dsec {
      background: var(--gray-100); border-radius: 10px; padding: 1rem 1.15rem;
    }
    .dsec h3 {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--gray-500); margin-bottom: .8rem;
    }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; }
    .info-label { font-size: .7rem; color: var(--gray-500); font-weight: 500; }
    .info-value { font-size: .88rem; color: var(--gray-900); font-weight: 500; margin-top: .08rem; }
    .info-value a { color: var(--green-500); text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }

    .work-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
    .work-chip {
      padding: .28rem .75rem; background: var(--white);
      border: 1.5px solid var(--green-400); color: var(--green-600);
      border-radius: 99px; font-size: .78rem; font-weight: 500;
    }

    .drow { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: .84rem; padding: .22rem 0; }
    .drow + .drow { border-top: 1px solid var(--gray-200); }
    .dk { color: var(--gray-500); }
    .dv { font-weight: 600; text-align: right; }

    .est-total {
      background: var(--green-800); color: var(--white); border-radius: 10px;
      padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between;
    }
    .est-total-label { font-size: .78rem; color: rgba(255,255,255,.6); }
    .est-total-val { font-size: 1.1rem; font-weight: 700; }

    .admin-sec {
      background: var(--green-50); border: 1.5px solid #c6e8d4;
      border-radius: 10px; padding: 1.15rem;
    }
    .admin-sec h3 { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--green-600); margin-bottom: .9rem; }
    .statut-sel {
      width: 100%; padding: .58rem .9rem; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-size: .88rem; font-family: inherit; font-weight: 600;
      background: var(--white); cursor: pointer; outline: none; margin-bottom: 1rem;
    }
    .statut-sel:focus { border-color: var(--green-500); }
    .note-lbl { font-size: .78rem; font-weight: 600; color: var(--gray-700); margin-bottom: .4rem; }
    .note-ta {
      width: 100%; min-height: 85px; padding: .6rem .9rem;
      border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-family: inherit; font-size: .85rem; resize: vertical; outline: none;
      transition: border-color .2s;
    }
    .note-ta:focus { border-color: var(--green-500); }
    .note-saved { font-size: .72rem; color: var(--green-500); margin-top: .3rem; min-height: 1em; transition: opacity .4s; opacity: 0; }

    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 900px) {
      .admin-body { flex-direction: column; padding: 1rem; gap: 1rem; }
      .admin-sidebar { width: 100%; }
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .filter-nav { flex-direction: row; flex-wrap: wrap; }
      .filter-nav .fnav-btn { border-left: none; border-bottom: 3px solid transparent; font-size: .78rem; padding: .48rem .7rem; }
      .filter-nav .fnav-btn.active { border-bottom-color: var(--green-500); border-left-color: transparent; background: var(--green-50); }
      .admin-header-inner { padding: .7rem 1rem; }
      #user-email { display: none; }
    }
    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
      .detail-drawer { width: 100vw; }
    }
  </style>
</head>
<body style="visibility:hidden">

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="assets/logo.svg" alt="Curage Vandaele"></div>
    <h1>Espace Admin</h1>
    <p>Accès réservé à l'équipe Vandaele.</p>
    <form id="login-form" novalidate>
      <div class="fg">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required autocomplete="email" placeholder="votre@email.fr">
      </div>
      <div class="fg">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" id="login-btn" class="btn-login">Se connecter</button>
    </form>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <img src="assets/logo.svg" alt="" class="admin-logo-img">
        <span class="admin-brand-name">Admin · Curage Vandaele</span>
      </div>
      <div class="admin-user">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn-logout">Déconnexion</button>
      </div>
    </div>
  </header>

  <div class="admin-body">
    <aside class="admin-sidebar">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val" id="stat-total">–</div><div class="stat-label">Total</div></div>
        <div class="stat-card stat-new"><div class="stat-val" id="stat-nouveau">–</div><div class="stat-label">Nouveaux</div></div>
        <div class="stat-card stat-prog"><div class="stat-val" id="stat-encours">–</div><div class="stat-label">En cours</div></div>
        <div class="stat-card stat-won"><div class="stat-val" id="stat-gagne">–</div><div class="stat-label">Gagnés</div></div>
      </div>

      <nav class="filter-nav">
        <button class="fnav-btn active" data-status="all">Toutes les demandes</button>
        <button class="fnav-btn" data-status="nouveau">🔴 Nouveaux</button>
        <button class="fnav-btn" data-status="contacte">🟡 Contactés</button>
        <button class="fnav-btn" data-status="devis_envoye">🔵 Devis envoyé</button>
        <button class="fnav-btn" data-status="chantier_gagne">🟢 Chantier gagné</button>
        <button class="fnav-btn" data-status="sans_suite">⚫ Sans suite</button>
      </nav>

      <button class="btn-refresh" id="btn-refresh">↻ Actualiser</button>
    </aside>

    <main class="admin-main">
      <div class="main-toolbar">
        <input type="search" id="search-input" placeholder="Rechercher nom, email, adresse…">
        <select id="sort-select">
          <option value="desc">Plus récent</option>
          <option value="asc">Plus ancien</option>
        </select>
      </div>
      <div id="requests-list" class="requests-list">
        <div class="state-msg">Chargement…</div>
      </div>
    </main>
  </div>
</div>

<!-- ===== DETAIL DRAWER ===== -->
<div id="detail-overlay" class="detail-overlay" hidden></div>
<div id="detail-drawer" class="detail-drawer" hidden>
  <div class="drawer-header">
    <div>
      <h2 id="drawer-name"></h2>
      <div id="drawer-meta" class="drawer-meta"></div>
    </div>
    <button id="drawer-close" class="drawer-close" aria-label="Fermer">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
