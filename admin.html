<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Curage Vandaele</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --green-900: #0d2b1a;
      --green-800: #133d22;
      --green-600: #2d7a4f;
      --green-500: #3d9e62;
      --green-400: #56b57a;
      --green-50:  #f0faf4;
      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-600:  #4b5563;
      --gray-500:  #6b7280;
      --gray-400:  #9ca3af;
      --gray-200:  #e5e7eb;
      --gray-100:  #f3f4f6;
      --white:     #ffffff;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --blue:      #3b82f6;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
      --header-h:  56px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--gray-900); background: var(--gray-100); min-height: 100vh; }

    /* ── LOGIN ─────────────────────────────────────────── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--green-900) 0%, #1a5232 100%);
      padding: 1rem;
    }
    .login-card {
      background: var(--white); border-radius: 18px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.35); text-align: center;
    }
    .login-logo { margin-bottom: 1.5rem; }
    .login-logo img { height: 52px; }
    .login-card h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: .35rem; }
    .login-card > p { color: var(--gray-500); font-size: .875rem; margin-bottom: 1.75rem; }
    .login-card .fg { margin-bottom: 1rem; text-align: left; }
    .login-card label { display: block; font-size: .78rem; font-weight: 600; color: var(--gray-700); margin-bottom: .35rem; }
    .login-card input {
      width: 100%; padding: .65rem .9rem;
      border: 1.5px solid var(--gray-200); border-radius: 8px;
      font-family: inherit; font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .login-card input:focus { border-color: var(--green-500); }
    .login-error {
      background: #fef2f2; color: var(--red);
      border: 1px solid #fecaca; border-radius: 8px;
      padding: .6rem .9rem; font-size: .83rem; margin-bottom: 1rem; text-align: left;
    }
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 2.8rem; }
    .toggle-pwd {
      position: absolute; right: .7rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--gray-400);
      padding: .2rem; line-height: 0; transition: color .2s;
    }
    .toggle-pwd:hover { color: var(--gray-700); }
    .remember-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
    .remember-row input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; accent-color: var(--green-500); }
    .remember-row label { margin: 0; font-size: .83rem; color: var(--gray-600); cursor: pointer; font-weight: 400; }
    .btn-login {
      width: 100%; padding: .8rem; background: var(--green-500); color: var(--white);
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: background .2s; margin-top: .25rem;
    }
    .btn-login:hover { background: var(--green-600); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    /* ── DASHBOARD ─────────────────────────────────────── */
    #dashboard { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .admin-header {
      background: var(--green-800); color: var(--white);
      height: var(--header-h); flex-shrink: 0; z-index: 10;
    }
    .admin-header-inner {
      height: 100%; max-width: 1800px; margin: 0 auto; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .admin-brand { display: flex; align-items: center; gap: .75rem; text-decoration: none; color: inherit; }
    .admin-logo-img { height: 28px; filter: brightness(10); }
    .admin-brand-name { font-weight: 600; font-size: .93rem; }
    .admin-user { display: flex; align-items: center; gap: 1rem; font-size: .82rem; }
    #user-email { color: rgba(255,255,255,.55); }
    .btn-logout {
      padding: .35rem .8rem; background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
      color: var(--white); font-size: .78rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.2); }
    /* Grille tarifaire dans le header */
    .btn-tarifs {
      padding: .35rem .8rem; background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
      color: var(--white); font-size: .78rem; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: background .2s;
      white-space: nowrap;
    }
    .btn-tarifs:hover { background: rgba(255,255,255,.22); }
    .btn-tarifs.active { background: var(--white); color: var(--green-800); border-color: var(--white); }

    /* ── 3-COLUMN LAYOUT ───────────────────────────────── */
    .admin-body {
      flex: 1; display: flex; overflow: hidden;
      max-width: 1800px; width: 100%; margin: 0 auto;
    }
    .admin-content { flex: 1; display: flex; min-width: 0; overflow: hidden; }

    /* ── SIDEBAR ───────────────────────────────────────── */
    .admin-sidebar {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 1.1rem;
      padding: 1.25rem 1rem;
      overflow-y: auto;
      border-right: 1px solid var(--gray-200);
      background: var(--white);
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .stat-card {
      background: var(--gray-100); border-radius: 8px;
      padding: .7rem .5rem; text-align: center;
    }
    .stat-val { font-size: 1.55rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: .62rem; color: var(--gray-500); margin-top: .2rem; text-transform: uppercase; letter-spacing: .06em; }
    .stat-new  .stat-val { color: var(--red); }
    .stat-prog .stat-val { color: var(--yellow); }
    .stat-won  .stat-val { color: var(--green-500); }

    .filter-nav { display: flex; flex-direction: column; }
    .filter-nav-label { font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--gray-400); padding: 0 .5rem; margin-bottom: .3rem; }
    .filter-nav .fnav-btn {
      padding: .55rem .75rem; border: none; background: none;
      text-align: left; font-size: .82rem; color: var(--gray-700);
      cursor: pointer; transition: background .15s;
      border-radius: 7px; font-family: inherit; font-weight: 500;
    }
    .filter-nav .fnav-btn:hover { background: var(--gray-100); }
    .filter-nav .fnav-btn.active { background: var(--green-50); color: var(--green-600); font-weight: 600; }


    /* ── LIST PANE ─────────────────────────────────────── */
    .list-pane {
      width: 360px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .list-toolbar {
      padding: .75rem; border-bottom: 1px solid var(--gray-200);
      display: flex; gap: .5rem; background: var(--white);
    }
    #search-input {
      flex: 1; padding: .55rem .85rem;
      border: 1.5px solid var(--gray-200); border-radius: 7px;
      font-size: .83rem; font-family: inherit; background: var(--gray-100);
      outline: none; transition: border-color .2s, background .2s;
    }
    #search-input:focus { border-color: var(--green-500); background: var(--white); }
    #sort-select {
      padding: .55rem .75rem; border: 1.5px solid var(--gray-200); border-radius: 7px;
      font-size: .78rem; font-family: inherit; background: var(--gray-100); cursor: pointer; outline: none;
    }
    #requests-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0;
      padding: .5rem;
    }
    .state-msg {
      padding: 3rem; text-align: center; color: var(--gray-400); font-size: .85rem;
    }

    /* ── CARDS ─────────────────────────────────────────── */
    .req-card {
      border-radius: 8px; padding: .85rem 1rem;
      cursor: pointer; border: 1.5px solid transparent;
      border-left-width: 4px;
      transition: background .12s, border-color .12s;
      display: flex; align-items: flex-start; gap: .75rem;
      margin-bottom: .4rem;
    }
    .req-card:hover { background: var(--gray-100); }
    .req-card.is-active { background: var(--green-50); border-color: var(--green-400); border-left-width: 4px; }

    .req-card.s-nouveau       { border-left-color: var(--red); }
    .req-card.s-contacte      { border-left-color: var(--yellow); }
    .req-card.s-devis_envoye  { border-left-color: var(--blue); }
    .req-card.s-chantier_gagne{ border-left-color: var(--green-500); }
    .req-card.s-sans_suite    { border-left-color: var(--gray-400); }

    .card-main { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-addr { color: var(--gray-500); font-size: .74rem; margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-preview { font-size: .74rem; color: var(--gray-500); margin-top: .3rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
    .card-metric { font-size: .74rem; font-weight: 600; color: var(--green-600); margin-top: .35rem; }
    .card-dist { font-size: .67rem; color: var(--gray-500); margin-bottom: .15rem; }
    .card-tags { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .4rem; }
    .ctag { font-size: .64rem; font-weight: 600; padding: .12rem .4rem; border-radius: 99px; background: var(--green-50); color: var(--green-600); }
    .ctag-contact { background: #eff6ff; color: var(--blue); }
    .card-right { text-align: right; flex-shrink: 0; min-width: 72px; }
    .card-amount { font-weight: 700; font-size: .82rem; color: var(--green-600); }
    .card-date { font-size: .67rem; color: var(--gray-400); margin-top: .15rem; }
    .card-badge { margin-top: .35rem; }
    /* Point clignotant sur les cartes jamais vues */
    .req-card.s-nouveau .card-name::before {
      content: ''; display: inline-block; width: 7px; height: 7px;
      background: var(--red); border-radius: 50%; margin-right: .45rem;
      vertical-align: middle; animation: pulse-dot 1.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    .badge {
      display: inline-block; font-size: .62rem; font-weight: 700;
      padding: .14rem .48rem; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .b-nouveau        { background:#fef2f2; color:var(--red); border: 1.5px solid #fca5a5; }
    .b-a_traiter      { background:#fff7ed; color:#ea580c; }
    .b-contacte       { background:#fffbeb; color:#d97706; }
    .b-devis_envoye   { background:#eff6ff; color:var(--blue); }
    .b-chantier_gagne { background:var(--green-50); color:var(--green-600); }
    .b-sans_suite     { background:var(--gray-100); color:var(--gray-500); }

    /* ── DETAIL PANE ───────────────────────────────────── */
    .detail-pane {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      overflow: hidden; background: var(--gray-100);
    }
    .detail-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--gray-400); gap: .75rem;
    }
    .detail-empty-icon { font-size: 2.2rem; }
    .detail-empty p { font-size: .85rem; line-height: 1.6; text-align: center; }

    .detail-header {
      background: var(--white); border-bottom: 1px solid var(--gray-200);
      padding: 1rem 1.5rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .detail-header h2 { font-size: 1rem; font-weight: 700; }
    .detail-meta { font-size: .74rem; color: var(--gray-500); margin-top: .18rem; }
    .btn-archive {
      padding: .38rem .75rem; background: var(--gray-100); color: var(--gray-600);
      border: 1.5px solid var(--gray-200); border-radius: 7px;
      font-size: .78rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .btn-archive:hover { background: var(--gray-200); border-color: var(--gray-400); }
    .btn-unarchive {
      padding: .38rem .75rem; background: #eff6ff; color: var(--blue);
      border: 1.5px solid #bfdbfe; border-radius: 7px;
      font-size: .78rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .btn-unarchive:hover { background: #dbeafe; border-color: var(--blue); }
    .btn-delete {
      display: flex; align-items: center; gap: .4rem;
      padding: .38rem .75rem; background: #fef2f2; color: var(--red);
      border: 1.5px solid #fecaca; border-radius: 7px;
      font-size: .78rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .btn-delete:hover { background: #fee2e2; border-color: var(--red); }
    .fnav-archived { margin-top: .35rem; border-top: 1px solid var(--gray-200); color: var(--gray-500) !important; }
    .fnav-archived.active { background: #f5f3ff !important; color: #7c3aed !important; }


    /* ── TARIFS PANEL ──────────────────────────────────── */
    .tarifs-panel {
      flex: 1; overflow-y: auto; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }
    .tarifs-panel-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
      flex-wrap: wrap;
    }
    .tarifs-panel-header h2 { font-size: 1rem; font-weight: 700; }
    .tarifs-panel-header p { font-size: .8rem; color: var(--gray-500); margin-top: .2rem; }
    .btn-tarifs-save {
      padding: .55rem 1.2rem; background: var(--green-500); color: var(--white);
      border: none; border-radius: 8px; font-size: .88rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background .2s; white-space: nowrap;
    }
    .btn-tarifs-save:hover { background: var(--green-600); }
    .btn-tarifs-save:disabled { opacity: .6; cursor: not-allowed; }
    .tarifs-status { font-size: .8rem; color: var(--green-600); min-height: 1.2em; }
    .tarifs-status.err { color: var(--red); }

    .coeff-bar {
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
      background: var(--white); border-radius: var(--radius); padding: .9rem 1.2rem;
      box-shadow: var(--shadow);
    }
    .coeff-label { font-size: .82rem; font-weight: 600; color: var(--gray-700); white-space: nowrap; }
    .coeff-slider { flex: 1; min-width: 140px; max-width: 260px; accent-color: var(--green-500); cursor: pointer; }
    .coeff-sign { font-weight: 700; font-size: .95rem; color: var(--green-600); width: .6rem; text-align: center; }
    .coeff-input { width: 58px; padding: .35rem .5rem; border: 1.5px solid var(--gray-200); border-radius: 6px; font-family: inherit; font-size: .88rem; text-align: right; outline: none; }
    .coeff-input:focus { border-color: var(--green-500); }
    .coeff-unit { font-size: .82rem; color: var(--gray-500); margin-left: -.4rem; }
    .btn-coeff-apply {
      padding: .38rem .9rem; background: var(--green-500); color: var(--white);
      border: none; border-radius: 7px; font-size: .82rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background .15s;
    }
    .btn-coeff-apply:hover { background: var(--green-600); }
    .btn-coeff-reset {
      padding: .38rem .9rem; background: var(--gray-100); color: var(--gray-600);
      border: 1.5px solid var(--gray-200); border-radius: 7px; font-size: .82rem;
      font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s;
    }
    .btn-coeff-reset:hover { background: var(--gray-200); }

    .tarifs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
    .tg-card { background: var(--white); border-radius: var(--radius); padding: .7rem 1rem; box-shadow: var(--shadow); }
    .tg-title { font-size: .69rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--gray-600); padding-bottom: .3rem; margin-bottom: .4rem; border-bottom: 1.5px solid var(--gray-200); }
    .tg-row { display: flex; align-items: center; gap: .35rem; padding: .18rem 0; font-size: .8rem; }
    .tg-label { flex: 1; color: var(--gray-700); min-width: 0; }
    .tg-unit { color: var(--gray-400); font-size: .68rem; font-style: italic; flex-shrink: 0; }
    .tg-input { width: 72px; padding: .22rem .42rem; border: 1.5px solid var(--gray-200); border-radius: 5px; font-family: inherit; font-size: .8rem; text-align: right; outline: none; transition: border-color .15s; flex-shrink: 0; }
    .tg-input:focus { border-color: var(--green-500); }
    .tg-sep { color: var(--gray-400); font-size: .72rem; flex-shrink: 0; }
    .tg-mod { display: flex; align-items: center; gap: .35rem; padding: .12rem 0 .12rem .55rem; font-size: .74rem; }
    .tg-mod-lbl { flex: 1; color: var(--gray-500); }
    .tg-mod-input { width: 50px; padding: .18rem .35rem; border: 1.5px solid var(--gray-200); background: var(--gray-50); border-radius: 5px; font-family: inherit; font-size: .74rem; text-align: right; outline: none; flex-shrink: 0; }
    .tg-mod-input:focus { border-color: var(--green-500); }
    .tg-pct { color: var(--gray-400); font-size: .7rem; flex-shrink: 0; }
    /* ── Tabs per-client ── */
    .tg-tabs { margin-top: .45rem; }
    .tg-tab-lbl { font-size: .65rem; text-transform: uppercase; font-weight: 700; color: var(--gray-400); letter-spacing: .06em; margin-bottom: .3rem; }
    .tg-tab-bar { display: flex; gap: .25rem; margin-bottom: .3rem; }
    .tg-tab-btn { flex: 1; padding: .22rem .15rem; border: 1.5px solid var(--gray-200); border-radius: 5px; background: var(--gray-50); font-size: .68rem; cursor: pointer; white-space: nowrap; color: var(--gray-600); transition: border-color .15s; }
    .tg-tab-btn:hover { border-color: var(--green-400); }
    .tg-tab-btn.active { border-color: var(--green-500); background: #f0fdf4; color: var(--blue-800); font-weight: 600; }
    .tg-tab-pane { display: none; }
    .tg-tab-pane.active { display: block; }

    .detail-scroll { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }

    /* shared detail sections */
    .dsec { background: var(--white); border-radius: var(--radius); padding: 1rem 1.15rem; box-shadow: var(--shadow); }
    .dsec h3 { font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--gray-500); margin-bottom: .75rem; display: flex; align-items: center; gap: .6rem; }
    .dist-badge { font-size: .68rem; font-weight: 600; background: #eff6ff; color: var(--blue); padding: .12rem .5rem; border-radius: 99px; text-transform: none; letter-spacing: 0; cursor: pointer; transition: background .15s; }
    .dist-badge:hover { background: #dbeafe; }

    /* ── ROUTE MODAL ──────────────────────────────────── */
    #route-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    #route-modal[hidden] { display: none !important; }
    #route-modal-inner { background: var(--white); border-radius: 12px; overflow: hidden; width: 100%; max-width: 680px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
    #route-modal-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem 1rem; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
    #route-modal-title { font-weight: 700; font-size: .92rem; color: var(--gray-900); }
    #route-modal-meta { font-size: .8rem; color: var(--gray-500); margin-top: .15rem; }
    #route-modal-actions { display: flex; align-items: center; gap: .45rem; flex-shrink: 0; }
    #route-map { flex: 1; min-height: 340px; }
    .btn-route-ext { padding: .32rem .75rem; background: var(--gray-100); border: 1.5px solid var(--gray-200); border-radius: 7px; font-size: .76rem; color: var(--gray-700); text-decoration: none; font-weight: 500; white-space: nowrap; transition: background .15s; }
    .btn-route-ext:hover { background: var(--gray-200); }
    .btn-route-close { width: 1.9rem; height: 1.9rem; border-radius: 50%; border: none; background: var(--gray-100); color: var(--gray-600); cursor: pointer; font-size: .88rem; font-family: inherit; transition: background .15s; }
    .btn-route-close:hover { background: var(--gray-200); }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; }
    .info-label { font-size: .68rem; color: var(--gray-500); font-weight: 500; }
    .info-value { font-size: .85rem; color: var(--gray-900); font-weight: 500; margin-top: .05rem; }
    .info-value a { color: var(--green-500); text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }
    .work-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .3rem; }
    .work-chip { padding: .25rem .7rem; background: var(--green-50); border: 1.5px solid var(--green-400); color: var(--green-600); border-radius: 99px; font-size: .76rem; font-weight: 500; }
    .drow { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: .83rem; padding: .22rem 0; }
    .drow + .drow { border-top: 1px solid var(--gray-200); }
    .dk { color: var(--gray-500); }
    .dv { font-weight: 600; text-align: right; }
    .est-total { background: var(--green-800); color: var(--white); border-radius: var(--radius); padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; }
    .est-total-label { font-size: .78rem; color: rgba(255,255,255,.6); }
    .est-total-val { font-size: 1.1rem; font-weight: 700; }

    .admin-sec { background: var(--green-50); border: 1.5px solid #c6e8d4; border-radius: var(--radius); padding: 1.1rem; }
    .admin-sec h3 { font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--green-600); margin-bottom: .85rem; }
    .statut-sel { width: 100%; padding: .55rem .85rem; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: .88rem; font-family: inherit; font-weight: 600; background: var(--white); cursor: pointer; outline: none; margin-bottom: 1rem; }
    .statut-sel:focus { border-color: var(--green-500); }
    .note-lbl { font-size: .78rem; font-weight: 600; color: var(--gray-700); margin-bottom: .4rem; }
    .note-ta { width: 100%; min-height: 80px; padding: .6rem .85rem; border: 1.5px solid var(--gray-200); border-radius: 8px; font-family: inherit; font-size: .85rem; resize: vertical; outline: none; transition: border-color .2s; }
    .note-ta:focus { border-color: var(--green-500); }
    .note-saved { font-size: .72rem; color: var(--green-500); margin-top: .3rem; min-height: 1em; transition: opacity .4s; opacity: 0; }

    /* ── ZONES ENVIRONNEMENTALES ───────────────────────── */
    .adm-zones-loading { color: var(--gray-400); font-size: .82rem; font-style: italic; }
    .adm-zone-ok { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; padding: .55rem .8rem; border-radius: 7px; font-size: .82rem; }
    .adm-zone-indispo { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; padding: .55rem .8rem; border-radius: 7px; font-size: .82rem; }
    .adm-accomp-badge { background: #fdf4ff; border: 1.5px solid #e879f9; color: #86198f; padding: .45rem .75rem; border-radius: 7px; font-size: .8rem; font-weight: 600; margin-bottom: .5rem; }
    .adm-accomp-banner { background: #fdf4ff; border: 2px solid #c026d3; color: #701a75; padding: .65rem .9rem; border-radius: 8px; font-size: .84rem; line-height: 1.55; margin-bottom: .9rem; }
    .adm-accomp-banner strong { display: block; margin-bottom: .2rem; font-size: .9rem; }
    .adm-zone-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
    .adm-ztag { padding: .2rem .6rem; border-radius: 99px; font-size: .73rem; font-weight: 600; }
    .adm-ztag-zh  { background: #dbeafe; color: #1e40af; }
    .adm-ztag-eco { background: #fef9c3; color: #854d0e; }
    .adm-demarches { margin-top: .3rem; }
    .adm-demarches-title { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--gray-500); margin-bottom: .5rem; }
    .adm-demarche-card { border-radius: 9px; border: 1.5px solid; margin-bottom: .55rem; overflow: hidden; }
    .adm-dc-zh  { border-color: #93c5fd; background: #f0f7ff; }
    .adm-dc-eco { border-color: #fcd34d; background: #fffdf0; }
    .adm-dc-zni { border-color: #6ee7b7; background: #f0fdf8; }
    .adm-dc-header { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; }
    .adm-dc-icon { font-size: 1.1rem; flex-shrink: 0; }
    .adm-dc-title { font-weight: 700; font-size: .83rem; color: var(--gray-900); }
    .adm-dc-subtitle { font-size: .72rem; color: var(--gray-500); margin-top: .05rem; }
    .adm-dc-level { margin-left: auto; font-size: .68rem; font-weight: 700; padding: .18rem .5rem; border-radius: 99px; flex-shrink: 0; white-space: nowrap; }
    .adm-dc-lv-zh  { background: #bfdbfe; color: #1d4ed8; }
    .adm-dc-lv-eco { background: #fde68a; color: #92400e; }
    .adm-dc-lv-zni { background: #a7f3d0; color: #065f46; }
    .adm-dc-body { padding: .5rem .8rem .7rem; border-top: 1px solid rgba(0,0,0,.07); }
    .adm-dc-seuils { display: flex; flex-direction: column; gap: .2rem; margin-bottom: .6rem; }
    .adm-dc-seuil { font-size: .74rem; padding: .22rem .55rem; border-radius: 5px; background: rgba(0,0,0,.05); color: var(--gray-600); }
    .adm-dc-seuil-ok     { background: #bbf7d0; color: #14532d; font-weight: 700; }
    .adm-dc-seuil-warn   { background: #fef08a; color: #713f12; font-weight: 700; }
    .adm-dc-seuil-danger { background: #fecaca; color: #7f1d1d; font-weight: 700; }
    .adm-dc-steps { display: flex; flex-direction: column; gap: .45rem; }
    .adm-dc-step { display: flex; gap: .55rem; align-items: flex-start; font-size: .77rem; }
    .adm-dc-step-num { width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--green-600); color: #fff; font-size: .65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: .05rem; }
    .adm-dc-step strong { display: block; color: var(--gray-800); margin-bottom: .08rem; font-size: .78rem; }
    .adm-dc-step p { margin: 0; color: var(--gray-600); line-height: 1.5; }
    .adm-dc-alert { margin-top: .55rem; padding: .4rem .65rem; background: rgba(0,0,0,.05); border-radius: 6px; font-size: .74rem; color: var(--gray-600); line-height: 1.5; }
    .adm-accomp-info { background: #fdf4ff; border: 1.5px solid #e879f9; color: #701a75; padding: .6rem .85rem; border-radius: 8px; font-size: .8rem; line-height: 1.55; margin-top: .5rem; }
    .adm-glossaire { margin-top: .9rem; padding: .55rem .8rem; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 7px; font-size: .74rem; color: var(--gray-600); }
    .adm-glossaire strong { display: block; color: var(--gray-700); margin-bottom: .3rem; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
    .adm-glossaire ul { margin: 0; padding-left: 1.1rem; line-height: 1.7; }
    abbr { text-decoration: underline dotted; cursor: help; }

    [hidden] { display: none !important; }

    /* ── RESPONSIVE ────────────────────────────────────── */
    @media (max-width: 1100px) {
      .list-pane { width: 300px; }
    }
    @media (max-width: 800px) {
      #dashboard { height: auto; overflow: visible; }
      .admin-body { flex-direction: column; overflow: visible; }
      .admin-content { flex-direction: column; }

      /* Sidebar compacte : tout en colonne, padding réduit */
      .admin-sidebar {
        width: 100%; flex-direction: column; gap: .35rem;
        border-right: none; border-bottom: 1px solid var(--gray-200);
        padding: .5rem .75rem;
      }

      /* Stats : 4 tuiles en ligne unique */
      .stats-grid { grid-template-columns: repeat(4, 1fr); gap: .3rem; }
      .stat-card { padding: .35rem .2rem; }
      .stat-val { font-size: 1.1rem; }
      .stat-label { font-size: .54rem; }

      /* Filtres : scroll horizontal — 1 seule ligne */
      .filter-nav {
        flex-direction: row; flex-wrap: nowrap;
        overflow-x: auto; gap: .2rem;
        padding-bottom: .15rem;
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
      }
      .filter-nav::-webkit-scrollbar { display: none; }
      .filter-nav-label { display: none; }
      .filter-nav .fnav-btn { font-size: .72rem; padding: .28rem .55rem; white-space: nowrap; flex-shrink: 0; }
      .fnav-archived { margin-top: 0; border-top: none; }


      /* Grille tarifaire : 1 colonne sur mobile */
      .tarifs-panel { padding: .75rem; }
      .tarifs-grid { grid-template-columns: 1fr; }
      .coeff-bar { padding: .65rem .75rem; gap: .5rem; }
      .coeff-slider { max-width: 100%; }

      .list-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--gray-200); max-height: 50vh; }
      #requests-list { max-height: calc(50vh - 48px); }
      .detail-pane { min-height: 400px; }
      #user-email { display: none; }
    }
    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
      .detail-scroll { padding: 1rem; }
    }
  </style>
</head>
<body style="visibility:hidden">

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="assets/logo.svg" alt="Curage Vandaele"></div>
    <h1>Espace Admin</h1>
    <p>Accès réservé à l'équipe Vandaele.</p>
    <form id="login-form" novalidate>
      <div class="fg">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required autocomplete="email" placeholder="votre@email.fr">
      </div>
      <div class="fg">
        <label for="l-password">Mot de passe</label>
        <div class="pwd-wrap">
          <input type="password" id="l-password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="toggle-pwd" class="toggle-pwd" aria-label="Afficher le mot de passe">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="remember-me" checked>
        <label for="remember-me">Se souvenir de moi</label>
      </div>
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" id="login-btn" class="btn-login">Se connecter</button>
    </form>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="index.html" class="admin-brand" title="Retour au site">
        <img src="assets/logo.svg" alt="" class="admin-logo-img">
        <span class="admin-brand-name">Admin</span>
      </a>
      <div class="admin-user">
        <span id="user-email"></span>
        <button class="btn-tarifs" id="btn-tarifs">⚙️ Grille tarifaire</button>
        <button id="logout-btn" class="btn-logout">Déconnexion</button>
      </div>
    </div>
  </header>

  <div class="admin-body">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-val" id="stat-total">–</div><div class="stat-label">Total</div></div>
        <div class="stat-card stat-new"><div class="stat-val" id="stat-nouveau">–</div><div class="stat-label">Non lus</div></div>
        <div class="stat-card stat-prog"><div class="stat-val" id="stat-encours">–</div><div class="stat-label">En cours</div></div>
        <div class="stat-card stat-won"><div class="stat-val" id="stat-gagne">–</div><div class="stat-label">Gagnés</div></div>
      </div>
      <nav class="filter-nav">
        <div class="filter-nav-label">Statut</div>
        <button class="fnav-btn active" data-status="all">Toutes</button>
        <button class="fnav-btn" data-status="nouveau">🔴 Non lus</button>
        <button class="fnav-btn" data-status="a_traiter">🟠 À traiter</button>
        <button class="fnav-btn" data-status="contacte">🟡 Contactés</button>
        <button class="fnav-btn" data-status="devis_envoye">🔵 Devis envoyé</button>
        <button class="fnav-btn" data-status="chantier_gagne">🟢 Gagné</button>
        <button class="fnav-btn" data-status="sans_suite">⚫ Sans suite</button>
        <button class="fnav-btn fnav-archived" data-status="archived">📦 Archivées</button>
      </nav>
    </aside>

    <!-- TARIFS PANEL -->
    <div class="tarifs-panel" id="tarifs-panel" hidden></div>

    <!-- CONTENU PRINCIPAL (list + détail) -->
    <div class="admin-content">

      <!-- LIST PANE -->
      <div class="list-pane">
        <div class="list-toolbar">
          <input type="search" id="search-input" placeholder="Rechercher…">
          <select id="sort-select">
            <option value="desc">Récent</option>
            <option value="asc">Ancien</option>
          </select>
        </div>
        <div id="requests-list">
          <div class="state-msg">Chargement…</div>
        </div>
      </div>

      <!-- DETAIL PANE -->
      <div class="detail-pane" id="detail-pane">
        <div class="detail-empty">
          <div class="detail-empty-icon">📋</div>
          <p>Sélectionnez une demande<br>pour voir les détails</p>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- Route modal -->
<div id="route-modal" hidden>
  <div id="route-modal-inner">
    <div id="route-modal-header">
      <div>
        <div id="route-modal-title">📍 Itinéraire depuis Tortefontaine</div>
        <div id="route-modal-meta">Calcul en cours…</div>
      </div>
      <div id="route-modal-actions">
        <a id="route-gmaps-link" href="#" target="_blank" rel="noopener" class="btn-route-ext">🗺️ Google Maps</a>
        <button id="route-modal-close" class="btn-route-close">✕</button>
      </div>
    </div>
    <div id="route-map"></div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
